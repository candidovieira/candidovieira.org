name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.169.0
      HUGO_ENVIRONMENT: production
      TZ: America/Sao_Paulo
    steps:
      - name: Install Hugo
        run: |
          wget -q -O ${{ runner.temp }}/hugo.deb \
            https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb
          sudo dpkg -i ${{ runner.temp }}/hugo.deb

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0   # needed for .GitInfo / .Lastmod

      - name: Bloquear conteúdo não revisado
        run: |
          pendentes=$(grep -rlE '^revisar:[[:space:]]*true' content || true)
          lacunas=$(grep -rlE '^\[[^]]+\]$' content || true)
          if [ -n "$pendentes$lacunas" ]; then
            echo "::error::Há conteúdo pendente de revisão. Publicação bloqueada."
            [ -n "$pendentes" ] && echo "Marcados com 'revisar: true':" && echo "$pendentes"
            [ -n "$lacunas" ] && echo "Com campos [a preencher]:" && echo "$lacunas"
            exit 1
          fi

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build
        run: |
          hugo --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
