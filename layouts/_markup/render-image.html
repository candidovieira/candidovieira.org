{{- $img := or (.Page.Resources.Get .Destination) (resources.Get .Destination) -}}
{{- with $img -}}
<img src="{{ .RelPermalink }}" width="{{ .Width }}" height="{{ .Height }}" alt="{{ $.Text }}" loading="lazy" decoding="async">
{{- else -}}
<img src="{{ .Destination | safeURL }}" alt="{{ .Text }}" loading="lazy" decoding="async">
{{- end -}}
